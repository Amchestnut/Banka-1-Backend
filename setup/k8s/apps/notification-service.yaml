apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: banka-1
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8006
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: banka-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/raf-si-2025/banka-1-backend/notification-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: banka-app-config
            - secretRef:
                name: banka-app-secrets
          env:
            - name: NOTIFICATION_SERVICE_HOST
              value: 0.0.0.0
            - name: NOTIFICATION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: NOTIFICATION_SERVER_PORT
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: NOTIFICATION_SERVER_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: NOTIFICATION_POSTGRES_DB
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-pguser-notification-service
                  key: pgbouncer-jdbc-uri
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-pguser-notification-service
                  key: user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-pguser-notification-service
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 35
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
