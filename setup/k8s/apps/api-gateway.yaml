        location /interbank/ {
            proxy_pass http://interbank_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /public-stock {
            proxy_pass http://interbank_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /negotiations {
            proxy_pass http://interbank_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /negotiations/ {
            proxy_pass http://interbank_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/user/[0-9]+/[A-Za-z0-9_.-]+$ {
            proxy_pass http://interbank_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /gateway-health {
            access_log off;
            return 200 'API Gateway is running safely!\n';
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banka-1
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banka-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nginx:alpine
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: USER_SERVICE_PORT
            - name: BANKING_CORE_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: BANKING_CORE_SERVICE_PORT
            - name: MARKET_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: MARKET_SERVICE_PORT
            - name: TRADING_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: TRADING_SERVICE_PORT
            - name: CREDIT_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: CREDIT_SERVER_PORT
            - name: NOTIFICATION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: NOTIFICATION_SERVER_PORT
            - name: SAGA_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: SAGA_SERVER_PORT
            - name: INTERBANK_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: INTERBANK_SERVER_PORT
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          readinessProbe:
            httpGet:
              path: /gateway-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: nginx-template
          configMap:
            name: api-gateway-nginx-template
