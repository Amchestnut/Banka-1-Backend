apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: banka-1
spec:
  selector:
    app: market-service
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: banka-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      containers:
        - name: market-service
          image: banka/market-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: banka-app-config
            - secretRef:
                name: banka-app-secrets
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: banka-app-config
                  key: MARKET_SERVICE_PORT
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-pguser-market-service
                  key: pgbouncer-jdbc-uri
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-pguser-market-service
                  key: user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-pguser-market-service
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 35
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
