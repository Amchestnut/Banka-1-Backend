apiVersion: v1
kind: ConfigMap
metadata:
  name: banka-app-config
  namespace: banka-1
data:
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200
  SWAGGER_ENABLED: "true"
  LIQUIBASE_CONTEXTS: dev
  TOKEN_REFRESH_EXPIRATION_DAYS: "7"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTGRES_HOST: db-pgbouncer
  POSTGRES_PORT: "5432"
  NOTIFICATION_EXCHANGE: employee.events
  NOTIFICATION_QUEUE: notification-service-queue
  NOTIFICATION_ROUTING_KEY: employee.#
  NOTIFICATION_CLIENT_ROUTING_KEY: client.#
  NOTIFICATION_CARD_ROUTING_KEY: card.#
  NOTIFICATION_CREDIT_ROUTING_KEY: credit.#
  NOTIFICATION_ORDER_ROUTING_KEY: order.#
  NOTIFICATION_TAX_ROUTING_KEY: tax.#
  NOTIFICATION_OTC_ROUTING_KEY: otc.#
  NOTIFICATION_SERVER_PORT: "8006"
  USER_SERVICE_PORT: "8081"
  BANKING_CORE_SERVICE_PORT: "8084"
  MARKET_SERVICE_PORT: "8085"
  TRADING_SERVICE_PORT: "8088"
  CREDIT_SERVER_PORT: "8089"
  INTERBANK_SERVER_PORT: "8091"
  SAGA_SERVER_PORT: "8095"
  NOTIFICATION_POSTGRES_DB: notification_db
  SAGA_POSTGRES_DB: saga_db
  USER_SERVICE_DB_HOST: db-pgbouncer
  USER_SERVICE_DB_PORT: "5432"
  USER_SERVICE_DB_NAME: user_service
  BANKING_CORE_DB_HOST: db-pgbouncer
  BANKING_CORE_DB_PORT: "5432"
  BANKING_CORE_DB_NAME: banking_core
  MARKET_SERVICE_DB_HOST: db-pgbouncer
  MARKET_SERVICE_DB_PORT: "5432"
  MARKET_SERVICE_DB_NAME: market_service
  TRADING_DB_HOST: db-pgbouncer
  TRADING_DB_PORT: "5432"
  TRADING_DB_NAME: trading
  CREDIT_DB_HOST: db-pgbouncer
  CREDIT_DB_PORT: "5432"
  CREDIT_DB_NAME: credit_db
  INTERBANK_DB_HOST: db-pgbouncer
  INTERBANK_DB_PORT: "5432"
  INTERBANK_DB_NAME: interbank_service
  USER_RESET_PASSWORD_URL: http://localhost:4200/reset-password?token=
  USER_ACTIVATE_ACCOUNT_URL: http://localhost:4200/auth/activate-account?token=
  BANKA_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:4200
  BANKA_SECURITY_CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
  BANKA_SECURITY_CORS_ALLOW_CREDENTIALS: "true"
  CARD_REQUEST_VERIFICATION_EXPIRATION_MINUTES: "15"
  CARD_CREATION_AUTOMATIC_DEFAULT_LIMIT: "1000000"
  VERIFICATION_ROUTING_KEY: verification.#
  SERVICES_USER_URL: http://user-service:8081
  SERVICES_BANKING_CORE_URL: http://banking-core-service:8084
  SERVICES_MARKET_URL: http://market-service:8085
  SERVICES_TRADING_URL: http://trading-service:8088
  STOCK_MARKET_DATA_BASE_URL: https://www.alphavantage.co
  STOCK_PRICE_CACHE_TTL_SECONDS: "15"
  FIREBASE_CREDENTIALS_PATH: ""
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
  SAGA_EXCHANGE: saga.exchange
  SAGA_DLQ: saga.dlq
  SAGA_EVENTS_QUEUE: saga.events
  SAGA_CMD_BANKING_QUEUE: saga.cmd.banking
  SAGA_CMD_ORDER_QUEUE: saga.cmd.order
  SAGA_CMD_OTC_QUEUE: saga.cmd.otc
  SAGA_CMD_FUND_QUEUE: saga.cmd.fund
  SAGA_RETRY_MAX_ATTEMPTS: "5"
  SAGA_RETRY_INITIAL_BACKOFF: "1000"
  SAGA_RETRY_MULTIPLIER: "2.0"
  BANKA1_ROUTING_NUMBER: "111"
  BANKA1_DISPLAY_NAME: Banka 1
  BANKA2_ROUTING_NUMBER: "222"
  BANKA2_DISPLAY_NAME: Banka 2
  BANKA2_BASE_URL: http://interbank-service:8091/_mock/banka2/
  INTERBANK_SPRING_PROFILES: dev
